name: Build Windows Portable

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (NSIS + MSI)
        run: pnpm tauri build

      - name: Pack portable folder
        shell: pwsh
        run: |
          $rel = "src-tauri/target/release"
          $out = "portable/YunX"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = Join-Path $rel "yunx-desktop.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem $rel -Filter "*.exe" | Select-Object Name
            throw "release exe not found"
          }
          Copy-Item $exe (Join-Path $out "YunX.exe")

          foreach ($name in @("aria2c","baidupcs","goproxy")) {
            $cand = @(
              (Join-Path $rel "$name.exe"),
              (Join-Path "src-tauri/binaries" "$name-x86_64-pc-windows-msvc.exe")
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($cand) {
              Copy-Item $cand (Join-Path $out "$name.exe")
            } else {
              Write-Warning "missing sidecar $name"
            }
          }

          @"
          @echo off
          cd /d "%~dp0"
          start "" "YunX.exe"
          "@ | Set-Content -Path (Join-Path $out "run.bat") -Encoding ASCII

          Compress-Archive -Path "$out\*" -DestinationPath "YunX-portable-windows-x64.zip" -Force
          Get-ChildItem "YunX-portable-windows-x64.zip","src-tauri/target/release/bundle" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName,Length

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: YunX-portable-windows-x64
          path: YunX-portable-windows-x64.zip
          if-no-files-found: error

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: YunX-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
